[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sofi-series"
version = "1.0.0"
description = "Sparseness Optimized Feature Importance for time series classification"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Isel Grau" },
    { name = "Gonzalo Napoles" },
    { name = "Agnieszka Jastrzebska" },
    { name = "Yamisleydi Salgueiro" },
]
keywords = [
    "explainable ai",
    "time series classification",
    "feature importance",
    "interpretability",
    "sparse explanations",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "ruptures>=1.1",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "pillow>=9.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
demo = [
    "scikit-learn>=1.1",
    "torch>=2.0",
    "keras>=3.0",
    "tsai>=0.3.9",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
include = ["sofits*"]

[tool.setuptools.package-data]
sofits = ["datasets/*/*.npy"]
